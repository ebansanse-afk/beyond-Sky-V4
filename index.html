<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>beyond Sky</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b30;color:#eaf6ff;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100dvh}#shell{width:min(100%,560px);min-height:100dvh;background:linear-gradient(150deg,#273f62,#10192e);padding:13px;display:flex;flex-direction:column;gap:10px}.brand{display:flex;justify-content:space-between;align-items:center;letter-spacing:3px;font-weight:900;color:#c8f5ff}.brand small{font-size:10px;letter-spacing:1px;color:#88b8d2}.screen{position:relative;border:7px solid #071225;border-radius:17px;overflow:hidden;background:#7cc6e5;aspect-ratio:1.22;box-shadow:0 6px 0 #405a78,0 12px 25px #0006}#view{width:100%;height:100%;display:block}.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 4px #123b62;font-size:13px;pointer-events:none}.overlay{position:absolute;inset:0;background:#0a1d35dc;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.panel{width:100%;max-width:370px;text-align:center}.panel h1{margin:4px 0 8px;font-size:30px;letter-spacing:2px}.panel p{font-size:13px;line-height:1.55;color:#c7e4f5}.drawbox{position:relative;background:#f2fbff;border-radius:12px;border:3px solid #65d7e8;overflow:hidden;height:165px;margin:10px auto}.drawbox:after{content:'✦  羽根を描こう  ✦';position:absolute;top:8px;left:0;right:0;color:#9aafc2;font-size:12px;pointer-events:none}#draw{width:100%;height:100%;touch-action:none;display:block}.row{display:flex;gap:8px;justify-content:center;margin:10px 0}.btn{border:0;border-radius:10px;background:#5ce2d4;color:#09243b;font-weight:900;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #229b99}.btn.secondary{background:#c2d7e9;box-shadow:0 4px 0 #7b9bb5}.tools{margin:5px 0;gap:5px}.tools .btn{padding:7px 8px;font-size:11px;background:#c2d7e9;box-shadow:0 2px 0 #789ab5}.tools .btn.active{background:#5ce2d4;box-shadow:0 2px 0 #229b99}.stats{font-size:13px;color:#8af9e8;font-weight:bold}.rank{background:#09182b;border-radius:12px;padding:10px;margin:12px 0;text-align:left}.rank div{padding:3px 8px;border-bottom:1px solid #29435d;font-size:13px}.rank b{color:#77f4dd}.control{flex:1;min-height:190px;border:2px solid #3b5b7c;border-radius:18px;background:radial-gradient(circle at 50% 30%,#324d71,#1c304d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:inset 0 3px 12px #081628}.label{font-size:11px;color:#9fc1d7;letter-spacing:3px}.stick{width:min(49vw,174px);height:min(49vw,174px);border-radius:50%;border:3px solid #7897b7;background:radial-gradient(circle,#243c5c 0 25%,#152944 70%);position:relative;touch-action:none;box-shadow:inset 0 5px 14px #091528,0 4px 8px #091528}.stick:before,.stick:after{content:'';position:absolute;background:#58779455;pointer-events:none}.stick:before{width:2px;height:90%;top:5%;left:50%}.stick:after{height:2px;width:90%;left:5%;top:50%}.knob{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#9ef9f1,#3c9bb7 75%);border:4px solid #c7ffff;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 5px 12px #0007;pointer-events:none}.foot{text-align:center;color:#829fb9;font-size:10px;padding-bottom:3px}#pause{position:absolute;bottom:10px;right:10px;background:#102942b8;color:white;border:1px solid #fff6;border-radius:7px;padding:6px 9px;display:none}#toast{position:absolute;bottom:10px;left:10px;color:white;font-size:12px;text-shadow:0 1px 4px black;pointer-events:none}</style></head><body><div id="shell"><div class="brand">BEYOND SKY <small>FLIGHT SYSTEM · 01</small></div><div class="screen"><canvas id="view"></canvas><div class="hud"><span id="score">SCORE 000000</span><span id="speed">WING 1.00×</span></div><div id="toast"></div><button id="pause">Ⅱ</button><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div><div class="control"><div class="label">◈ FLIGHT CONTROLLER ◈</div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="label">DRAG TO FLY · RELEASE TO CENTER</div></div><div class="foot">beyond Sky — Draw your wings. Chase the horizon.</div></div><script>
const view=document.getElementById('view'),ctx=view.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),pauseBtn=document.getElementById('pause');let W=500,H=400,dpr=1,mode='menu',last=0,score=0,wing=1,player={x:0,y:0},objects=[],spawn=0,travel=0,stickX=0,stickY=0,wingPixels=[],wingArt=null,wingBounds=null,drawing=false,drawCtx=null,drawCanvas=null,keys={};const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function resize(){let r=view.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;view.width=W*dpr;view.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function menu(){mode='menu';overlay.style.display='flex';pauseBtn.style.display='none';panel.innerHTML=`<h1>beyond Sky</h1><p>自分だけの羽根を描いて、空の果てまで飛ぼう。<br>描いた羽根の形がそのまま左右の翼になる！<br>羽根が大きいほど、上下左右の移動が速くなる！</p><div class="drawbox"><canvas id="draw"></canvas></div><div class="row tools"><button class="btn tool active" data-tool="brush">✏️ ペン</button><button class="btn tool" data-tool="fill">🪣 塗りつぶし</button><button class="btn tool" data-tool="eraser">消しゴム</button></div><div class="stats" id="wingInfo">羽根の大きさ：0%　機動力：1.00×</div><div class="row"><button class="btn secondary" id="clear">全消去</button><button class="btn" id="start">飛び立つ ▶</button></div><p>画面下のスティックを動かして障害物を避けよう。<br>PCでは矢印キー / WASD も使用可能。</p>`;setupDraw();document.getElementById('clear').onclick=()=>{drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);calcWing()};document.getElementById('start').onclick=startGame}
let drawTool='brush';
function setupDraw(){
 drawTool='brush';drawCanvas=document.getElementById('draw');let rect=drawCanvas.getBoundingClientRect();drawCanvas.width=Math.round(rect.width*2);drawCanvas.height=Math.round(rect.height*2);drawCtx=drawCanvas.getContext('2d');
 document.querySelectorAll('[data-tool]').forEach(btn=>btn.onclick=()=>{drawTool=btn.dataset.tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b===btn))});
 let prev=null;function point(e){let r=drawCanvas.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*drawCanvas.width/r.width),y:Math.floor((e.clientY-r.top)*drawCanvas.height/r.height)}}
 function stroke(a,b){drawCtx.save();drawCtx.globalCompositeOperation=drawTool==='eraser'?'destination-out':'source-over';drawCtx.lineWidth=drawTool==='eraser'?35:18;drawCtx.lineCap='round';drawCtx.lineJoin='round';drawCtx.strokeStyle='#307fbb';drawCtx.beginPath();drawCtx.moveTo(a.x,a.y);drawCtx.lineTo(b.x,b.y);drawCtx.stroke();drawCtx.restore()}
 function fillAt(pt){const w=drawCanvas.width,h=drawCanvas.height;if(pt.x<0||pt.y<0||pt.x>=w||pt.y>=h)return;const img=drawCtx.getImageData(0,0,w,h),d=img.data,idx=(pt.y*w+pt.x)*4,base=[...d.slice(idx,idx+4)],target=[48,127,187,255];if(base.every((v,i)=>v===target[i]))return;const seen=new Uint8Array(w*h),stack=[pt.y*w+pt.x];let count=0;while(stack.length){let n=stack.pop();if(seen[n])continue;seen[n]=1;let k=n*4;if(Math.abs(d[k]-base[0])>5||Math.abs(d[k+1]-base[1])>5||Math.abs(d[k+2]-base[2])>5||Math.abs(d[k+3]-base[3])>5)continue;d[k]=target[0];d[k+1]=target[1];d[k+2]=target[2];d[k+3]=255;let x=n%w,y=(n/w)|0;if(x>0)stack.push(n-1);if(x<w-1)stack.push(n+1);if(y>0)stack.push(n-w);if(y<h-1)stack.push(n+w);if(++count>w*h)break}drawCtx.putImageData(img,0,0)}
 drawCanvas.onpointerdown=e=>{let pt=point(e);if(drawTool==='fill'){fillAt(pt);calcWing();return}drawing=true;drawCanvas.setPointerCapture(e.pointerId);prev=pt;stroke(pt,pt);calcWing()};drawCanvas.onpointermove=e=>{if(!drawing)return;let pt=point(e);stroke(prev,pt);prev=pt;calcWing()};drawCanvas.onpointerup=drawCanvas.onpointercancel=()=>{drawing=false;calcWing()};
}
function calcWing(){if(!drawCtx)return;let {data}=drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height);let filled=0;for(let i=3;i<data.length;i+=16)if(data[i]>80)filled++;let coverage=clamp(filled/(drawCanvas.width*drawCanvas.height/4)*100,0,100);wing=1+clamp(coverage/27,0,1)*2.3;let el=document.getElementById('wingInfo');if(el)el.textContent=`羽根の大きさ：${Math.round(coverage)}%　機動力：${wing.toFixed(2)}×`}
function startGame(){calcWing();wingArt=document.createElement('canvas');wingArt.width=drawCanvas.width;wingArt.height=drawCanvas.height;wingArt.getContext('2d').drawImage(drawCanvas,0,0);
 const pixels=wingArt.getContext('2d').getImageData(0,0,wingArt.width,wingArt.height).data;
 let minX=wingArt.width,minY=wingArt.height,maxX=-1,maxY=-1;
 for(let yy=0;yy<wingArt.height;yy+=2)for(let xx=0;xx<wingArt.width;xx+=2){
  if(pixels[(yy*wingArt.width+xx)*4+3]>50){minX=Math.min(minX,xx);minY=Math.min(minY,yy);maxX=Math.max(maxX,xx);maxY=Math.max(maxY,yy)}
 }
 wingBounds=maxX>=0?{x:minX,y:minY,w:Math.max(1,maxX-minX+2),h:Math.max(1,maxY-minY+2)}:null;score=0;travel=0;spawn=.5;objects=[];player={x:0,y:0};mode='play';overlay.style.display='none';pauseBtn.style.display='block';speedEl.textContent=`WING ${wing.toFixed(2)}×`;last=performance.now()}
function finish(){mode='over';pauseBtn.style.display='none';let scores=[];try{scores=JSON.parse(localStorage.getItem('beyondSkyTop10')||'[]')}catch(e){}scores.push(Math.floor(score));scores.sort((a,b)=>b-a);scores=scores.slice(0,10);try{localStorage.setItem('beyondSkyTop10',JSON.stringify(scores))}catch(e){}overlay.style.display='flex';panel.innerHTML=`<h1>FLIGHT OVER</h1><p>今回のスコア</p><h1 style="color:#76ffe0">${Math.floor(score).toLocaleString()}</h1><div class="rank"><b>🏆 TOP 10 FLIGHTS</b>${scores.map((s,i)=>`<div>${String(i+1).padStart(2,'0')}　${s.toLocaleString()} ${i===0?'✦':''}</div>`).join('')}</div><div class="row"><button class="btn secondary" id="redraw">羽根を描き直す</button><button class="btn" id="retry">もう一度 ▶</button></div>`;document.getElementById('redraw').onclick=menu;document.getElementById('retry').onclick=startGame}

function project(x,y,z){
 const depth=Math.max(.8,z), f=1/(.32+depth*.075);
 return {x:W*.5+x*f*W*.13,y:H*.44+(2.7-y)*f*H*.15,s:f};
}
function poly(pts,color,stroke){
 ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
 for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
 ctx.closePath();ctx.fillStyle=color;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function drawWorld(t){
 let sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,'#17396e');sky.addColorStop(.42,'#8ccde4');sky.addColorStop(.67,'#cde7d7');sky.addColorStop(1,'#719a84');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#fff0b4';ctx.beginPath();ctx.arc(W*.79,H*.16,W*.05,0,Math.PI*2);ctx.fill();
 // Distant mountains are anchored to the horizon.
 for(let i=-1;i<12;i++){
  let x=i*W/9,y=H*.47+Math.sin(i*1.9)*H*.045;
  poly([{x:x-W*.16,y:H*.52},{x,y},{x:x+W*.18,y:H*.52}],'#8daeb0');
 }
 // Continuous solid ground plane; its front edge extends below the screen.
 let farL=project(-120,0,120),farR=project(120,0,120);
 let nearL=project(-120,0,.9),nearR=project(120,0,.9);
 poly([farL,farR,nearR,nearL],'#436c63');
 // A runway and side city blocks sit directly on this ground.
 let roadFarL=project(-3.7,.015,110),roadFarR=project(3.7,.015,110);
 let roadNearL=project(-3.7,.015,.9),roadNearR=project(3.7,.015,.9);
 poly([roadFarL,roadFarR,roadNearR,roadNearL],'#344653');
 for(let side of [-1,1]){
  let a=project(side*3.6,.03,.9),b=project(side*3.6,.03,110);
  ctx.strokeStyle='#f2d18d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 }
 for(let z=2;z<115;z+=9){
  let zz=(z+travel)%113+1;
  let a=project(-.08,.035,zz),b=project(.08,.035,zz);
  let c=project(-.08,.035,zz+3),d=project(.08,.035,zz+3);
  poly([a,b,d,c],'#d9d6b1');
 }
 // Ground grid scrolls toward camera and confirms where the ground is.
 for(let z=4;z<120;z+=9){
  let zz=(z+travel*.6)%116+2;
  let a=project(-45,.02,zz),b=project(45,.02,zz);
  ctx.strokeStyle='#7fa69a50';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 }
}
function drawBuilding(o){
 if(o.z<.8)return;
 let half=o.r*.58, x=o.x, z=o.z, h=o.height;
 let p0=project(x-half,0,z),p1=project(x+half,0,z);
 let p2=project(x+half,h,z),p3=project(x-half,h,z);
 let sideDepth=Math.min(3,o.r*.6);
 let p4=project(x+half,0,z+sideDepth),p5=project(x+half,h,z+sideDepth),p6=project(x-half,h,z+sideDepth);
 poly([p0,p1,p2,p3],o.color,'#b6d9dc');
 poly([p1,p4,p5,p2],'#304e67','#9bb9c7');
 poly([p3,p2,p5,p6],'#a0c4c7','#d5ecdf');
 let cols=3,rows=Math.max(2,Math.floor(h*1.5));
 for(let row=1;row<=rows;row++)for(let col=1;col<=cols;col++){
  let xx=p3.x+(p2.x-p3.x)*col/(cols+1);
  let yy=p3.y+(p0.y-p3.y)*row/(rows+1);
  let ww=Math.max(1,Math.abs(p2.x-p3.x)*.1);
  let wh=Math.max(1,Math.abs(p0.y-p3.y)/(rows+1)*.35);
  ctx.fillStyle='#c4e8db';ctx.fillRect(xx-ww/2,yy,ww,wh);
 }
 // Building foundations are at world height zero, matching the road.
}
function drawPlane(){
 let x=W*.5+player.x*W*.115,y=H*.73+player.y*H*.14,sz=Math.min(W,H)*.12;
 ctx.save();ctx.translate(x,y);ctx.rotate(-stickX*.13);
 // Rear chase view: wings spread horizontally; tail and engines face camera.
 // User drawing is the wing geometry itself, not a texture inside fixed wings.
 if(wingArt){
  let b=wingBounds;
  if(b){
   const ratio=b.w/b.h;
   const wingWidth=sz*clamp(1.0+ratio*.3,1.15,2.4);
   const wingHeight=sz*.75;
   for(let side of [-1,1]){
    ctx.save();
    if(side===-1)ctx.scale(-1,1);
    // Paint only the actual nontransparent pixels of the custom wing.
    ctx.drawImage(wingArt,b.x,b.y,b.w,b.h,sz*.15,-sz*.30,wingWidth,wingHeight);
    ctx.restore();
   }
  }
 }
 // Engine pods and fuselage, seen from directly behind.
 for(let side of [-1,1]){
  poly([{x:side*sz*.32,y:sz*.08},{x:side*sz*.52,y:sz*.10},{x:side*sz*.50,y:sz*.62},{x:side*sz*.30,y:sz*.62}],'#244d70','#b5e6ef');
  ctx.fillStyle='#ffb56c';ctx.beginPath();ctx.ellipse(side*sz*.41,sz*.62,sz*.10,sz*.07,0,0,Math.PI*2);ctx.fill();
 }
 poly([{x:-sz*.28,y:-sz*.22},{x:sz*.28,y:-sz*.22},{x:sz*.22,y:sz*.67},{x:-sz*.22,y:sz*.67}],'#c7e7ed','#2c6483');
 poly([{x:-sz*.07,y:-sz*.90},{x:sz*.07,y:-sz*.90},{x:sz*.18,y:sz*.30},{x:-sz*.18,y:sz*.30}],'#4d91b2','#d5f5ff');
 poly([{x:-sz*.7,y:sz*.36},{x:sz*.7,y:sz*.36},{x:sz*.59,y:sz*.55},{x:-sz*.59,y:sz*.55}],'#6caec7','#d7f7ff');
 ctx.restore();
}
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000||0,.04);last=now;if(mode==='play'){let kx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),ky=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let dx=clamp(stickX+kx,-1,1),dy=clamp(stickY+ky,-1,1);player.x=clamp(player.x+dx*dt*wing*2.2,-3.5,3.5);player.y=clamp(player.y+dy*dt*wing*2.2,-2.1,2.1);let speed=12+Math.min(score/350,20);travel+=dt*speed;score+=dt*speed*12;scoreEl.textContent='SCORE '+String(Math.floor(score)).padStart(6,'0');spawn-=dt;if(spawn<=0){spawn=Math.max(.35,1.25-score/6500)*(.7+Math.random()*.55);objects.push({x:(Math.random()-.5)*8.2,y:-2.9,z:65,r:.75+Math.random()*.75,height:2+Math.random()*4,color:['#618da1','#7997a5','#536c8b','#a0a99e'][Math.floor(Math.random()*4)]})}for(let o of objects){o.z-=speed*dt;if(o.z<3.2&&o.z>-.4&&Math.abs(o.x-player.x)<o.r*.7+.35&&2.7+player.y*1.1<o.height+.35){finish();break}}objects=objects.filter(o=>o.z>-.5)}drawWorld(now);objects.sort((a,b)=>b.z-a.z).forEach(drawBuilding);drawPlane();if(mode==='pause'){ctx.fillStyle='#00172c99';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2)}}
const stick=document.getElementById('stick'),knob=document.getElementById('knob');function moveStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.32;let dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy),f=dist>max?max/dist:1;dx*=f;dy*=f;stickX=dx/max;stickY=dy/max;knob.style.left=`calc(50% + ${dx}px)`;knob.style.top=`calc(50% + ${dy}px)`}function resetStick(){stickX=stickY=0;knob.style.left='50%';knob.style.top='50%'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);moveStick(e)};stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))moveStick(e)};stick.onpointerup=stick.onpointercancel=resetStick;addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);pauseBtn.onclick=()=>{if(mode==='play'){mode='pause';pauseBtn.textContent='▶'}else if(mode==='pause'){mode='play';pauseBtn.textContent='Ⅱ';last=performance.now()}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'){mode='pause';pauseBtn.textContent='▶'}});menu();requestAnimationFrame(frame);
</script></body></html>
